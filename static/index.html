<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf2f0">
<title>珊瑚菌 · Ramaria</title>
<!-- Google Fonts 已移除，使用 variables.css 中的系统字体栈回退 -->
<!-- 全局 CSS 变量 -->
<link rel="stylesheet" href="/static/css/variables.css">
<style>
/* ─── 覆盖全局变量（index.html 专用值） ───────────────────── */
:root {
  /* 页面背景色 */
  --bg: oklch(0.975 0.002 25);
  /* 侧边栏尺寸 */
  --sidebar-w: 300px;
  --header-h:  62px;
}

/* ─── 页面样式 ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ─── 侧边栏 ─────────────────────────────────────────────────── */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  z-index: 20;
  transform: translateX(-100%);
  transition: transform 0.32s var(--ease-smooth), box-shadow 0.32s;
}
.sidebar.open {
  transform: translateX(0);
  box-shadow: var(--shadow-lg);
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-default);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: var(--shadow-pink);
  flex-shrink: 0;
}
.logo-text {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--text-1);
  letter-spacing: -0.01em;
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  transition: background 0.15s, color 0.15s;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--gray-100); color: var(--text-1); }
.icon-btn svg { width: 18px; height: 18px; }

/* 新对话按钮 */
.new-chat-btn {
  margin: 16px;
  padding: 10px 16px;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  color: white;
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
  transition: transform 0.15s var(--ease-spring), box-shadow 0.15s, opacity 0.15s;
  box-shadow: var(--shadow-pink);
  flex-shrink: 0;
}
.new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px oklch(0.55 0.18 10 / .30); }
.new-chat-btn:active { transform: translateY(0); }
.new-chat-btn svg { width: 16px; height: 16px; }

/* 会话列表 */
.session-list-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 10px;
}
.session-list-wrap::-webkit-scrollbar { width: 4px; }
.session-list-wrap::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

.session-group-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 16px 10px 6px;
}

.session-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.session-item:hover { background: var(--gray-100); }
.session-item.active {
  background: var(--pink-50);
  border: 1px solid var(--pink-100);
}
.session-item.active .session-title { color: var(--pink-500); }

.session-title {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.session-meta {
  font-size: 0.75rem;
  color: var(--text-3);
  display: flex; gap: 6px;
}

/* 侧边栏底部 */
.sidebar-footer {
  padding: 12px;
  border-top: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  text-decoration: none;
}
.sidebar-nav-item:hover { background: var(--gray-100); color: var(--text-1); }
.sidebar-nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ─── 覆盖层 ─────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: var(--overlay-bg);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.overlay.show { opacity: 1; pointer-events: auto; }

/* ─── 主区域 ─────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ─── Header ─────────────────────────────────────────────────── */
.header {
  height: var(--header-h);
  padding: 0 20px;
  background: oklch(0.975 0.002 25 / 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  position: sticky; top: 0;
  z-index: 10;
}

.header-title {
  flex: 1;
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 模式徽章 */
.mode-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  font-weight: 500;
  background: var(--blue-50);
  color: var(--blue-500);
  border: 1px solid var(--blue-100);
  transition: all 0.2s;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}
.mode-badge.online {
  background: oklch(0.95 0.06 150);
  color: oklch(0.40 0.14 150);
  border-color: oklch(0.85 0.08 150);
}
.mode-badge.pending {
  background: oklch(0.95 0.06 80);
  color: oklch(0.45 0.10 80);
  border-color: oklch(0.85 0.08 80);
}
.mode-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.mode-badge.online .mode-dot { animation: pulse-dot 2s ease infinite; }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(0.8); }
}

/* ─── 消息区 ─────────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 32px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

/* 空状态 */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 20px;
  text-align: center;
}
.empty-hero {
  width: 80px; height: 80px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--pink-200), var(--pink-400));
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: var(--shadow-pink);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-8px); }
}
.empty-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--text-1);
}
.empty-desc {
  font-size: 0.9rem;
  color: var(--text-2);
  line-height: 1.7;
  max-width: 300px;
}
.empty-suggestions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 360px;
}
.suggestion-chip {
  padding: 11px 16px;
  background: var(--surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.18s var(--ease-smooth);
  text-align: left;
  display: flex; align-items: center; gap: 10px;
}
.suggestion-chip:hover {
  border-color: var(--pink-200);
  background: var(--pink-50);
  color: var(--pink-500);
  transform: translateX(4px);
}
.suggestion-chip span { font-size: 1rem; }

/* 时间戳分隔 */
.time-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0 8px;
  color: var(--text-3);
  font-size: 0.75rem;
}
.time-divider::before, .time-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-default);
}

/* 消息行 */
.msg-row {
  display: flex;
  gap: 10px;
  max-width: 100%;
  animation: msg-in 0.28s var(--ease-smooth) both;
}
.msg-row.user { flex-direction: row-reverse; }

@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  margin-top: 2px;
}
.avatar.ai-avatar {
  background: linear-gradient(135deg, var(--pink-200), var(--pink-400));
}
.avatar.user-avatar {
  background: linear-gradient(135deg, var(--blue-200), var(--blue-400));
  font-size: 12px;
  font-weight: 600;
  color: white;
  font-family: var(--font-mono);
}

.msg-content { max-width: min(72%, 560px); display: flex; flex-direction: column; gap: 4px; }
.msg-row.user .msg-content { align-items: flex-end; }

.bubble {
  padding: 11px 16px;
  border-radius: var(--radius-lg);
  font-size: 0.9375rem;
  line-height: 1.65;
  position: relative;
  word-break: break-word;
}

.bubble.ai {
  background: var(--surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 6px;
  color: var(--text-1);
  box-shadow: var(--shadow-sm);
}
.bubble.user {
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  color: white;
  border-radius: var(--radius-lg) var(--radius-lg) 6px var(--radius-lg);
  box-shadow: var(--shadow-pink);
}

/* 思考链折叠 */
.think-block {
  border-left: 2px solid var(--pink-200);
  padding: 6px 12px;
  margin-bottom: 8px;
  font-size: 0.82rem;
  color: var(--text-3);
  font-style: italic;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
  transition: background 0.12s;
}
.think-block:hover { background: var(--pink-50); }
.think-content { display: none; margin-top: 4px; white-space: pre-wrap; }
.think-block.open .think-content { display: block; }

.msg-time {
  font-size: 0.72rem;
  color: var(--text-3);
  padding: 0 4px;
}

/* 打字动画 */
.typing-bubble {
  background: var(--surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 6px;
  padding: 14px 18px;
  display: flex; gap: 5px; align-items: center;
  box-shadow: var(--shadow-sm);
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--pink-300);
  animation: typing-bounce 1.2s ease infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.30s; }
@keyframes typing-bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
  40%           { transform: translateY(-6px); opacity: 1; }
}

/* 历史聊天返回按钮 */
.history-back-btn {
  text-align: center;
  padding: 8px 0 12px;
  cursor: pointer;
}
.history-back-btn span {
  display: inline-block;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  color: var(--pink-500);
  background: var(--pink-50);
  border: 1px solid var(--pink-100);
  transition: all 0.18s;
}
.history-back-btn span:hover {
  background: var(--pink-100);
  border-color: var(--pink-200);
}

/* 系统通知 */
.sys-notice {
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-3);
  padding: 6px 16px;
  margin: 8px 0;
}
.sys-notice span {
  background: var(--surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-full);
  padding: 4px 14px;
  display: inline-block;
}

/* ─── 输入区 ─────────────────────────────────────────────────── */
.input-wrap {
  padding: 12px 16px 16px;
  background: oklch(0.975 0.002 25 / 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-default);
  flex-shrink: 0;
}

.input-box {
  max-width: var(--max-content, 760px);
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: 8px 8px 8px 16px;
  transition: border-color 0.18s, box-shadow 0.18s;
  box-shadow: var(--shadow-sm);
}
.input-box:focus-within {
  border-color: var(--pink-300);
  box-shadow: 0 0 0 4px oklch(0.55 0.18 10 / 0.08), var(--shadow-sm);
}

textarea#user-input {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.9375rem;
  color: var(--text-1);
  line-height: 1.55;
  min-height: 24px;
  max-height: 160px;
  padding: 6px 0;
}
textarea#user-input::placeholder { color: var(--text-3); }

/* 附件按钮 */
.attach-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.attach-btn:hover { background: var(--gray-100); color: var(--text-2); }
.attach-btn svg { width: 18px; height: 18px; }

/* 发送按钮 */
.send-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.18s var(--ease-spring), box-shadow 0.18s, opacity 0.18s;
  box-shadow: var(--shadow-pink);
}
.send-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px oklch(0.55 0.18 10 / .30); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; transform: none; cursor: not-allowed; box-shadow: none; }
.send-btn svg { width: 18px; height: 18px; }

/* 输入工具栏 */
.input-toolbar {
  max-width: var(--max-content, 760px);
  margin: 8px auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}
.toolbar-left { display: flex; align-items: center; gap: 4px; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }

.tool-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  color: var(--text-2);
  background: var(--gray-100);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}
.tool-chip:hover { background: var(--pink-50); border-color: var(--pink-200); color: var(--pink-500); }
.tool-chip svg { width: 13px; height: 13px; }

.char-count { font-size: 0.75rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ─── Toast ─────────────────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  padding: 10px 20px;
  background: var(--gray-700);
  color: white;
  border-radius: var(--radius-full);
  font-size: 0.875rem;
  box-shadow: var(--shadow-lg);
  animation: toast-in 0.3s var(--ease-spring) both;
  pointer-events: auto;
}
.toast.success { background: oklch(0.40 0.14 150); }
.toast.error   { background: oklch(0.44 0.18 20); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ─── 响应式 ─────────────────────────────────────────────────── */
@media (min-width: 768px) {
  .sidebar {
    transform: translateX(0);
    box-shadow: none;
  }
  .main { margin-left: var(--sidebar-w); }
  .overlay { display: none !important; }
  .header .icon-btn[aria-label="菜单"] { display: none; }
}

@media (max-width: 480px) {
  .messages { padding: 20px 14px 12px; }
  .input-wrap { padding: 10px 12px 14px; }
  .bubble { padding: 10px 14px; font-size: 0.9rem; }
  .msg-content { max-width: 84%; }
}

/* ─── 美化 messages 最大宽 ─────────────────────────────────────── */
.messages-inner {
  width: 100%;
  max-width: var(--max-content, 760px);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ─── 保存按钮提示 ───────────────────────────────────────────── */
.save-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--blue-500);
  background: var(--blue-50);
  border: 1px solid var(--blue-100);
  cursor: pointer;
  transition: all 0.18s;
}
.save-chip:hover {
  background: var(--blue-100);
  border-color: var(--blue-200);
}
.save-chip svg { width: 13px; height: 13px; }
</style>
</head>
<body>

<!-- ── 侧边栏遮罩 ── -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ── 侧边栏 ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">🪸</div>
      <span class="logo-text">珊瑚菌</span>
    </div>
    <button class="icon-btn" onclick="closeSidebar()" aria-label="关闭侧边栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <button class="new-chat-btn" onclick="newChat()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    新建对话
  </button>

  <div class="session-list-wrap" id="session-list">
    <!-- 会话列表由 JS 动态加载 -->
  </div>

  <div class="sidebar-footer">
    <a class="sidebar-nav-item" href="/memory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18"/>
      </svg>
      记忆查看器
    </a>
    <a class="sidebar-nav-item" href="/import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
      </svg>
      导入记录
    </a>
    <a class="sidebar-nav-item" href="/dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>

<script>
// ─── api.js 加载失败时的内联回退（确保核心功能不依赖外部 JS 文件） ──
if (typeof API === 'undefined') {
  console.warn('[Ramaria] 外部 api.js 未加载/执行，启用内联回退');
  const __ak = (document.querySelector('meta[name="api-key"]')||{}).content||'';
  async function __req(url, opts={}) {
    const h = {'Content-Type':'application/json'};
    if (__ak) h['X-API-Key'] = __ak;
    if (opts.headers) Object.assign(h, opts.headers);
    let r; try { r = await fetch(url, {...opts, headers:h}); }
    catch(e) { throw new Error('网络连接失败，请检查网络后重试（'+e.message+'）'); }
    if (!r.ok) { let d='HTTP '+r.status; try { const b=await r.json(); if(b.detail)d=b.detail; } catch(_){} throw new Error(d); }
    return r.json();
  }
  window.API = {
    _isFallback: true,  // 标记：标识这是内联回退版本
    async chat(c)       { return __req('/chat',{method:'POST',body:JSON.stringify({content:c})}); },
    async save()        { return __req('/save',{method:'POST'}); },
    async getRouterStatus()   { return __req('/router/status'); },
    async toggleRouter(on)    { return __req('/router/toggle',{method:'POST',body:JSON.stringify({online:on})}); },
    async getSessions()       { return __req('/api/sessions'); },
    async getSessionMessages(id) { return __req('/api/sessions/'+id+'/messages'); },
    connectWs({onMessage,onOpen,onClose,onError}) {
      const p = location.protocol==='https:'?'wss:':'ws:';
      const u = p+'//'+location.host+'/ws'+(__ak?'?api_key='+encodeURIComponent(__ak):'');
      const ws = new WebSocket(u);
      ws.onopen=()=>{console.log('[WS-回退] 已连接');if(onOpen)onOpen();};
      ws.onmessage=e=>{try{onMessage(JSON.parse(e.data));}catch(x){console.error('[WS] 解析失败',x);}};
      ws.onclose=e=>{console.log('[WS] 断开',e.code);if(onClose)onClose(e);};
      ws.onerror=e=>{console.error('[WS] 错误',e);if(onError)onError(e);};
      return ws;
    },
    wsSendChat(ws,c) { if(!ws||ws.readyState!==WebSocket.OPEN)return false; ws.send(JSON.stringify({type:'chat',content:c})); return true; },
    async getSettings()     { return __req('/api/settings'); },
    async saveSettings(s)   { return __req('/api/settings',{method:'POST',body:JSON.stringify(s)}); },
  };
}

// ─── 启动诊断：检测各模块加载状态（帮助排查前端 JS 加载问题）──────
(function() {
  var diag = {
    time:     new Date().toISOString(),
    url:      location.href,
    protocol: location.protocol,
    host:     location.host,
    AppState: typeof AppState !== 'undefined',
    API_ext:  typeof API !== 'undefined' && !(API._isFallback),
    API_fb:   typeof API !== 'undefined' && API._isFallback === true,
    UI:       typeof UI !== 'undefined',
    apiKeyMeta: !!document.querySelector('meta[name="api-key"]'),
  };
  console.log('[Ramaria-诊断]', JSON.stringify(diag));
  if (!diag.AppState) console.error('[Ramaria-诊断] ✗ state.js 未加载 — 页面功能将严重受限');
  if (!diag.API_ext && !diag.API_fb) console.error('[Ramaria-诊断] ✗ api.js 未加载且无回退 — 所有 API 调用将失败');
  if (diag.API_fb)       console.warn('[Ramaria-诊断] ⚠ 使用内联回退（外部 api.js 加载失败，原因可能是 MIME 类型/缓存/路径问题）');
  if (diag.API_ext)      console.log('[Ramaria-诊断] ✓ 外部 api.js 正常加载');
  if (!diag.UI)          console.error('[Ramaria-诊断] ✗ ui.js 未加载');
  if (!diag.apiKeyMeta)  console.warn('[Ramaria-诊断] ⚠ 未找到 api-key meta 标签，API 调用可能因缺少认证而失败');
  window.__ramaria_diag = diag;
})();

// ─── 加载会话列表 ────────────────────────────────────────────────
// 带重试机制：首次失败后自动重试 2 次（间隔递增），全部失败后显示错误并提供手动重试按钮
let _sessionListRetryCount = 0;
const _SESSION_LIST_MAX_RETRIES = 3;

async function loadSessionList() {
  const container = document.getElementById('session-list');
  if (!container) return;

  try {
    const sessions = await API.getSessions();
    _sessionListRetryCount = 0;  // 成功后重置计数
    renderSessionList(sessions);
  } catch (err) {
    _sessionListRetryCount++;
    console.error(`加载会话列表失败 (第${_sessionListRetryCount}次):`, err);
    
    if (_sessionListRetryCount < _SESSION_LIST_MAX_RETRIES) {
      // 自动重试，间隔递增：1s → 2s → 3s
      const delay = _sessionListRetryCount * 1000;
      container.innerHTML = `
        <div class="session-item empty-state">
          <div class="session-title">正在加载…</div>
          <div class="session-preview">第 ${_sessionListRetryCount} 次重试中</div>
        </div>`;
      setTimeout(() => loadSessionList(), delay);
      return;
    }
    
    // 全部重试失败，显示详细诊断信息
    const diag  = window.__ramaria_diag || {};
    const errMsg = err.message || String(err);
    const errName = err.name || 'Error';
    
    // 诊断摘要
    var diagLines = [];
    if (!diag.API_ext && !diag.API_fb) diagLines.push('✗ 外部 api.js 未加载（无内联回退）');
    if (diag.API_fb)                  diagLines.push('⚠ 外部 api.js 加载失败，已启用内联回退');
    if (diag.API_ext)                 diagLines.push('✓ 外部 api.js 已正常加载');
    if (!diag.AppState)               diagLines.push('✗ state.js 未加载');
    if (!diag.apiKeyMeta)             diagLines.push('⚠ 缺少 api-key meta 标签');
    var diagHtml = diagLines.length ? diagLines.map(function(l){return '<div style="font-size:0.72rem;color:var(--text-3)">'+l+'</div>';}).join('') : '';
    
    // 可能的修复建议
    var hintHtml = '';
    if (errName === 'ReferenceError' || (diag.API_fb && !errMsg.includes('HTTP'))) {
      hintHtml = '<div style="margin-top:8px;font-size:0.7rem;color:var(--text-dim);line-height:1.5">'
        + '💡 请打开浏览器开发者工具（F12），查看 Console 和 Network 标签：<br>'
        + '　· 检查 /static/js/api.js 是否返回 200<br>'
        + '　· 检查是否有 MIME type 警告<br>'
        + '　· 查看完整报错堆栈信息</div>';
    }
    
    container.innerHTML = `
      <div class="session-item empty-state">
        <div class="session-title">加载失败</div>
        <div class="session-preview" style="margin-bottom:4px;font-family:var(--font-mono);font-size:0.75rem;color:var(--color-error)">${errName}: ${errMsg}</div>
        ${diagHtml}
        ${hintHtml}
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          <button onclick="loadSessionList()" 
                  style="padding:6px 14px;border-radius:6px;border:1px solid var(--border-default);
                         background:var(--surface);color:var(--text-2);cursor:pointer;font-size:0.78rem">
            🔄 重试
          </button>
          <button onclick="console.log(JSON.stringify(window.__ramaria_diag,null,2));alert('诊断数据已输出到 Console（F12）')" 
                  style="padding:6px 14px;border-radius:6px;border:1px solid var(--border-default);
                         background:var(--surface);color:var(--text-2);cursor:pointer;font-size:0.78rem">
            📋 查看诊断
          </button>
        </div>
      </div>`;
    
    console.error('[Ramaria] loadSessionList 全部重试失败:', {
      error:     errMsg,
      errorName: errName,
      stack:     err.stack,
      retries:   _sessionListRetryCount,
      diag:      diag,
    });
  }
}

function renderSessionList(sessions) {
  const container = document.getElementById('session-list');
  if (!container) return;

  if (!sessions || sessions.length === 0) {
    container.innerHTML = `
      <div class="session-item empty-state">
        <div class="session-title">暂无历史对话</div>
        <div class="session-preview">开始与珊瑚菌对话后，对话记录会显示在这里</div>
      </div>`;
    return;
  }

  const now = new Date();
  const today = now.toDateString();
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  const yesterdayStr = yesterday.toDateString();
  const weekAgo = new Date(now);
  weekAgo.setDate(now.getDate() - 7);

  const groups = { today: [], yesterday: [], week: [], older: [] };

  sessions.forEach(session => {
    const date = session.last_message_at ? new Date(session.last_message_at) : new Date(session.started_at);
    if (date.toDateString() === today) {
      groups.today.push(session);
    } else if (date.toDateString() === yesterdayStr) {
      groups.yesterday.push(session);
    } else if (date > weekAgo) {
      groups.week.push(session);
    } else {
      groups.older.push(session);
    }
  });

  let html = '';

  if (groups.today.length > 0) {
    html += '<div class="session-group-label">今天</div>';
    groups.today.forEach(s => {
      html += createSessionItem(s, '刚刚');
    });
  }

  if (groups.yesterday.length > 0) {
    html += '<div class="session-group-label">昨天</div>';
    groups.yesterday.forEach(s => {
      const time = formatSessionTime(new Date(s.last_message_at || s.started_at), true);
      html += createSessionItem(s, '昨天 ' + time);
    });
  }

  if (groups.week.length > 0) {
    html += '<div class="session-group-label">本周</div>';
    groups.week.forEach(s => {
      const date = new Date(s.last_message_at || s.started_at);
      const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const time = formatSessionTime(date, false);
      html += createSessionItem(s, days[date.getDay()] + ' ' + time);
    });
  }

  if (groups.older.length > 0) {
    html += '<div class="session-group-label">更早</div>';
    groups.older.forEach(s => {
      const date = new Date(s.last_message_at || s.started_at);
      const time = formatSessionTime(date, false);
      html += createSessionItem(s, `${date.getMonth() + 1}/${date.getDate()} ${time}`);
    });
  }

  container.innerHTML = html;
}

function createSessionItem(session, timeStr) {
  const isActive = AppState.sessionId === session.id;
  const title = session.last_message_preview || `Session #${session.id}`;
  const preview = session.last_message_preview ? title.substring(0, 30) + (title.length > 30 ? '...' : '') : '';
  return `
    <div class="session-item${isActive ? ' active' : ''}" onclick="loadSession(${session.id})">
      <div class="session-title" title="${title}">${title}</div>
      <div class="session-meta"><span>${timeStr}</span></div>
    </div>`;
}

function formatSessionTime(date, includeToday) {
  const hhmm = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (includeToday) {
    const diffMs = new Date() - date;
    if (diffMs < 5 * 60 * 1000) return '刚刚';
    if (diffMs < 60 * 60 * 1000) return Math.floor(diffMs / 60000) + '分钟前';
  }
  return hhmm;
}

function loadSession(id) {
  closeSidebar();
  AppState.setLoading(true);
  UI.showToast('对话加载中…');

  // 加载历史消息
  API.getSessionMessages(id)
    .then(messages => {
      if (messages.length === 0) {
        UI.showToast('该对话暂无消息');
        AppState.setLoading(false);
        return;
      }

      // 清空当前消息
      const container = document.getElementById('messages-inner');
      container.innerHTML = '';

      // 渲染历史消息
      messages.forEach(msg => {
        UI.appendBubble(msg.content, msg.role, false, false, msg.created_at);
      });

      AppState.setSessionId(id);
      document.getElementById('header-title').textContent = messages[0]?.content?.substring(0, 20) || '历史对话';
      AppState.setLoading(false);

      // 更新会话列表中的高亮
      loadSessionList();
    })
    .catch(err => {
      UI.showToast('加载失败：' + err.message, 'error');
      AppState.setLoading(false);
    });
}

// ─── 发送消息 ────────────────────────────────────────────────────
function sendSuggestion(el) {
  const text = el.textContent.trim().replace(/^[^\s]+ /, '');
  document.getElementById('user-input').value = text;
  sendMessage();
}

function sendMessage() {
  if (AppState.isLoading) return;

  const input = document.getElementById('user-input');
  const content = input.value.trim();
  if (!content) return;

  // 清除空状态
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  // 先渲染用户消息气泡（即时反馈）
  UI.appendBubble(content, 'user', false, false, new Date().toISOString());
  input.value = '';
  UI.autoResizeTextarea(input);

  // ── 优先通过 WebSocket 发送 ──
  if (_ws && _ws.readyState === WebSocket.OPEN) {
    UI.showTyping();
    AppState.setLoading(true);
    const sent = API.wsSendChat(_ws, content);
    if (!sent) {
      UI.hideTyping();
      AppState.setLoading(false);
      UI.showToast('消息发送失败，请检查网络连接', 'error');
    }
    return;
  }

  // ── WebSocket 未连接时的处理 ──
  // 尝试触发 WebSocket 重连
  if (typeof connectWebSocket === 'function') {
    connectWebSocket();
  }

  // ── HTTP 兜底：POST /chat（兼容性保障，避免完全无法发消息）──
  UI.showTyping();
  AppState.setLoading(true);
  API.chat(content)
    .then(data => {
      UI.hideTyping();
      UI.renderAssistantReply(data.reply, data.mode);
      AppState.setSessionId(data.session_id);
      AppState.setLoading(false);
      // 更新模式徽章
      if (data.mode === 'online') {
        UI.updateModeUI('online');
        AppState.setOnline(true);
        setTimeout(() => { UI.updateModeUI('local'); AppState.setOnline(false); }, 2000);
      } else if (data.mode === 'confirm') {
        UI.updateModeUI('pending');
      } else {
        if (!AppState.isOnline) UI.updateModeUI('local');
      }
      document.getElementById('user-input')?.focus();
    })
    .catch(err => {
      UI.hideTyping();
      AppState.setLoading(false);
      UI.showToast('发送失败：' + (err.message || '请稍后重试'), 'error');
      console.error('[HTTP fallback] 发送失败:', err);
    });
}

// appendMessage 已由 UI.appendBubble 替代，此函数保留用于兼容性
function appendMessage(role, content) {
  UI.appendBubble(content, role, false, false, new Date().toISOString());
}

// showTyping/hideTyping 已由 UI.showTyping/UI.hideTyping 替代
// 保留别名用于兼容性
function showTyping() { UI.showTyping(); }
function hideTyping() { UI.hideTyping(); }

// scrollToBottom 已由 UI.scrollToBottom 替代
function scrollToBottom() { UI.scrollToBottom(); }

// ─── 保存 ────────────────────────────────────────────────────────
async function saveSession() {
  try {
    await API.save();
    UI.showToast('对话已保存', 'success');
    document.getElementById('save-chip').style.display = 'none';
  } catch (err) {
    UI.showToast('保存失败：' + err.message, 'error');
  }
}

// showToast 已由 UI.showToast 替代
function showToast(msg, type = '') { UI.showToast(msg, type); }

// autoResize 已由 UI.autoResizeTextarea 替代
function autoResize(el) { UI.autoResizeTextarea(el); }

const textarea = document.getElementById('user-input');
textarea.addEventListener('input', function() {
  autoResize(this);
  const count = this.value.length;
  const el = document.getElementById('char-count');
  el.textContent = count > 0 ? `${count}` : '';
});
textarea.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ─── 页面初始化 ────────────────────────────────────────────────────
// 页面加载完成后加载会话列表（WebSocket 连接由 app.js 统一管理，避免重复连接）
document.addEventListener('DOMContentLoaded', () => {
  loadSessionList();
});
</script>
