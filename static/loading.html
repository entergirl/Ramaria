<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="珊瑚菌">
  <meta name="theme-color" content="#faf5f3">
  <title>珊瑚菌 · 启动中</title>

  <!-- 复用 variables.css 中的 CSS 变量 -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/animations.css">

  <style>
    /* 加载页面专用样式 */
    .loading-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px;
      text-align: center;
    }

    /* Logo 动画容器 */
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 8px;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
    }

    /* 品牌名称 */
    .loading-brand {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--coral);
      letter-spacing: 4px;
      animation: fadeIn 0.6s ease-out 0.3s both;
    }

    /* 标语 */
    .loading-tagline {
      font-size: 0.85rem;
      color: var(--text-mid);
      font-family: var(--font-body);
      letter-spacing: 0.5px;
      animation: fadeIn 0.6s ease-out 0.5s both;
    }

    /* 进度条容器 */
    .loading-progress-container {
      width: 200px;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
      animation: fadeIn 0.4s ease-out 0.6s both;
    }

    /* 进度条 */
    .loading-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,
        var(--brand) 0%,
        var(--coral) 50%,
        var(--brand) 100%
      );
      background-size: 200% 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
      animation: progressShimmer 2s linear infinite;
    }

    /* 百分比显示 */
    .loading-percentage {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--coral);
      letter-spacing: 1px;
      animation: fadeIn 0.4s ease-out 0.6s both;
    }

    /* 状态文字 */
    .loading-status {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      animation: fadeIn 0.4s ease-out 0.6s both;
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .loading-logo {
        width: 64px;
        height: 64px;
      }

      .loading-brand {
        font-size: 1.25rem;
        letter-spacing: 3px;
      }

      .loading-tagline {
        font-size: 0.78rem;
      }

      .loading-progress-container {
        width: 160px;
      }

      .loading-content {
        padding: 24px;
      }
    }

    /* 减少动画偏好适配 */
    @media (prefers-reduced-motion: reduce) {
      .loading-brand,
      .loading-tagline,
      .loading-progress-container,
      .loading-percentage,
      .loading-status {
        animation: none;
        opacity: 1;
      }

      .loading-progress-bar {
        animation: none;
      }
    }
  </style>
</head>
<body>

<!-- 加载界面（复用 index.html 中的设计） -->
<div class="loading-page">
  <div class="loading-content">
    <!-- 品牌 Logo 动画 -->
    <div class="loading-logo">
      <svg viewBox="0 0 64 64" class="logo-svg">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd1cc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#cc7a7a;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="none" stroke="url(#logoGradient)" stroke-width="3" class="logo-circle"/>
        <path d="M20 32c0-6.6 5.4-12 12-12s12 5.4 12 12-5.4 12-12 12" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" class="logo-path"/>
        <circle cx="26" cy="28" r="3" fill="#cc7a7a" class="logo-dot"/>
        <circle cx="38" cy="28" r="3" fill="#cc7a7a" class="logo-dot"/>
        <path d="M28 38c2 2 6 2 8 0" fill="none" stroke="#cc7a7a" stroke-width="2" stroke-linecap="round" class="logo-smile"/>
      </svg>
    </div>
    <!-- 品牌名称 -->
    <div class="loading-brand">珊瑚菌</div>
    <div class="loading-tagline">正在启动你的 AI 陪伴助手...</div>
    <!-- 进度条 -->
    <div class="loading-progress-container">
      <div class="loading-progress-bar" id="progress-bar"></div>
    </div>
    <!-- 进度百分比 -->
    <div class="loading-percentage" id="progress-percent">0%</div>
    <!-- 加载状态文字 -->
    <div class="loading-status" id="progress-status">正在初始化...</div>
  </div>
</div>

<script>
/**
 * 加载页面进度管理器
 * 调用 POST /api/admin/init 触发后端初始化，然后轮询 GET /api/admin/init-progress 获取进度
 */

(function() {
  'use strict';

  const POLL_INTERVAL = 500;      // 轮询间隔 (ms)
  const MAX_WAIT_TIME = 300000;   // 最大等待时间 (ms) — 5 分钟

  let startTime = Date.now();
  let pollTimer = null;
  let lastStep = 0;

  // DOM 元素
  const progressBar = document.getElementById('progress-bar');
  const progressPercent = document.getElementById('progress-percent');
  const progressStatus = document.getElementById('progress-status');

  /** 更新进度条和状态文字 */
  function updateProgress(pct, message) {
    if (progressBar) progressBar.style.width = pct + '%';
    if (progressPercent) progressPercent.textContent = pct + '%';
    if (progressStatus) progressStatus.textContent = message;
  }

  /** 检查配置是否就绪，返回 true=可直接启动 false=需要配置向导 */
  async function checkCanStart() {
    try {
      const resp = await fetch('/api/admin/status');
      if (!resp.ok) return false;
      const data = await resp.json();
      return data.can_start === true;
    } catch (e) {
      console.warn('[Loading] 检查 can_start 失败:', e);
      return false;
    }
  }

  /** 初始化完成后，根据配置状态跳转到对应页面 */
  async function checkCanStartAndRedirect() {
    const canStart = await checkCanStart();
    if (canStart) {
      console.log('[Loading] 配置就绪，跳转到首页');
      redirectTo('/');
    } else {
      console.log('[Loading] 配置未就绪，跳转到配置向导');
      redirectTo('/api/admin/launcher/page');
    }
  }

  /** 跳转到目标页面（loading.html 作为初始加载页，直接使用浏览器跳转） */
  function redirectTo(url) {
    console.log('[Loading] 跳转到:', url);
    window.location.href = url;
  }

  /** 轮询初始化进度 */
  async function poll() {
    try {
      const resp = await fetch('/api/admin/init-progress');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();

      const step     = data.step     || 0;
      const total    = data.total    || 6;
      const name     = data.step_name || '正在初始化…';
      const elapsed  = data.elapsed_ms || 0;
      const done     = data.done     || false;
      const error    = data.error    || '';

      // 进度百分比
      const pct = total > 0 ? Math.round((step / total) * 100) : 0;

      // 状态文字：步骤名 + 耗时
      let statusText = name;
      if (step > 0 && elapsed > 0) {
        statusText += ' (' + (elapsed / 1000).toFixed(2) + 's)';
      }
      if (error) {
        statusText = '❌ ' + error;
      }

      updateProgress(pct, statusText);
      lastStep = step;

      if (done) {
        // 初始化完成 → 检查配置是否就绪，决定跳转目标
        console.log('[Loading] 初始化完成，检查配置状态…');
        checkCanStartAndRedirect();
        return;
      }

      // 超时检查
      if (Date.now() - startTime >= MAX_WAIT_TIME) {
        updateProgress(100, '启动超时，请检查配置…');
        console.error('[Loading] 初始化超时');
        return;
      }
    } catch (e) {
      console.warn('[Loading] 轮询失败，重试中:', e);
      updateProgress(lastStep > 0 ? Math.round((lastStep / 6) * 100) : 0, '正在连接服务…');
    }

    // 继续轮询
    pollTimer = setTimeout(poll, POLL_INTERVAL);
  }

  /** 触发后端初始化，然后开始轮询 */
  async function start() {
    // 先检查是否已初始化完成（避免重复调用 init）
    try {
      const checkResp = await fetch('/api/admin/init-progress');
      if (checkResp.ok) {
        const checkData = await checkResp.json();
        if (checkData.done && !checkData.error) {
          console.log('[Loading] 初始化已完成，检查配置状态…');
          checkCanStartAndRedirect();
          return;
        }
      }
    } catch (e) {
      // 检查失败，继续正常初始化流程
      console.log('[Loading] 检查初始化状态失败，继续初始化:', e);
    }

    console.log('[Loading] 触发初始化…');
    try {
      const resp = await fetch('/api/admin/init', { method: 'POST' });
      const data = await resp.json();
      console.log('[Loading] init 响应:', data);
    } catch (e) {
      console.warn('[Loading] 触发 init 失败，仍尝试轮询:', e);
      // 即使触发失败也继续轮询（服务可能已在初始化中）
    }

    updateProgress(0, '正在启动…');
    lastStep = 0;
    poll();
  }

  // 页面加载完成后自动启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

</body>
</html>
